<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap Grid Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

  <!-- HEADER -->
  <div class="bg-primary text-white text-center p-4 mb-4">
    <h1>Bootstrap Grid Demo</h1>
    <p>CISC 3610 | Saleh Salem</p>
  </div>

  <div class="container">

    <!-- ONE COLUMN -->
    <h2 class="mb-3">One Column</h2>
    <div class="row mb-4">
      <div class="col">
        <div class="bg-info text-white text-center p-3 rounded">Full Width Column</div>
      </div>
    </div>

    <!-- TWO COLUMNS -->
    <h2 class="mb-3">Two Columns</h2>
    <div class="row mb-4">
      <div class="col-6">
        <div class="bg-success text-white text-center p-3 rounded">Column 1</div>
      </div>
      <div class="col-6">
        <div class="bg-success text-white text-center p-3 rounded">Column 2</div>
      </div>
    </div>

    <!-- THREE COLUMNS -->
    <h2 class="mb-3">Three Columns</h2>
    <div class="row mb-4">
      <div class="col-4">
        <div class="bg-warning text-white text-center p-3 rounded">Column 1</div>
      </div>
      <div class="col-4">
        <div class="bg-warning text-white text-center p-3 rounded">Column 2</div>
      </div>
      <div class="col-4">
        <div class="bg-warning text-white text-center p-3 rounded">Column 3</div>
      </div>
    </div>

    <!-- FOUR COLUMNS -->
    <h2 class="mb-3">Four Columns</h2>
    <div class="row mb-4">
      <div class="col-3">
        <div class="bg-danger text-white text-center p-3 rounded">Column 1</div>
      </div>
      <div class="col-3">
        <div class="bg-danger text-white text-center p-3 rounded">Column 2</div>
      </div>
      <div class="col-3">
        <div class="bg-danger text-white text-center p-3 rounded">Column 3</div>
      </div>
      <div class="col-3">
        <div class="bg-danger text-white text-center p-3 rounded">Column 4</div>
      </div>
    </div>

    <!-- MIXED COLUMNS -->
    <h2 class="mb-3">Mixed Columns</h2>
    <div class="row mb-4">
      <div class="col-8">
        <div class="bg-secondary text-white text-center p-3 rounded">Wide Column (8)</div>
      </div>
      <div class="col-4">
        <div class="bg-secondary text-white text-center p-3 rounded">Narrow Column (4)</div>
      </div>
    </div>

  </div>

  <footer class="text-center p-4 mt-4 bg-light">
    <p>Bootstrap Grid Demo | CISC 3610</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
